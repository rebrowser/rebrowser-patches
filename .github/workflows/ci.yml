name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # runner.temp isn't available in job-level env, so export the work dir here
      - name: Set work dir
        run: echo "REBROWSER_WORK_DIR=$RUNNER_TEMP/rbp-work" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; keep CI on the same npm the release uses.
      - name: Upgrade npm
        run: npm install -g npm@^11

      - name: Preflight
        run: node release/doctor.mjs

      - name: Build drop-in packages
        run: node release/build-packages.mjs

      - name: Build Python wheels
        run: |
          set -e
          beta=$(node -e "const v=require('./release/versions.json');const p=v.python[0];process.stdout.write(p.driver.version)")
          node release/build-python.mjs 1.64.0 --driver-tgz "$REBROWSER_WORK_DIR/dist/rebrowser-playwright-core-${beta}.tgz"

      - name: Install browser dependencies for tests
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$REBROWSER_WORK_DIR/browsers" >/dev/null || true

      - name: Run test suite
        run: |
          set -e
          dist="$REBROWSER_WORK_DIR/dist"
          wheel=$(ls "$REBROWSER_WORK_DIR"/dist-py/*linux*x86_64*.whl | head -1)
          xvfb-run -a node tests/run.mjs \
            --pptr-core "$dist/rebrowser-puppeteer-core-25.14.0.tgz" \
            --pptr "$dist/rebrowser-puppeteer-25.14.0.tgz" \
            --pw-core "$dist/rebrowser-playwright-core-1.64.1.tgz" \
            --pw "$dist/rebrowser-playwright-1.64.1.tgz" \
            --py-wheel "$wheel" \
            --out "$REBROWSER_WORK_DIR/test-out"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.REBROWSER_WORK_DIR }}/test-out
          if-no-files-found: ignore
